<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check First</title>
<style>
  :root{
    --ink:#1c1c1c; --mut:#6b6b6b; --line:#ddd9d1; --bg:#faf9f7;
    --risk:#8a3b2e; --riskbg:#fbf1ee;
    --unk:#9a7418;  --unkbg:#fdf8ec;
    --norm:#2f5d50; --normbg:#eef4f1;
  }
  *{box-sizing:border-box}
  body{
    margin:0 auto; padding:22px 18px 56px; max-width:600px;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    line-height:1.62; font-size:15px;
  }

  /* 머리말 */
  .head{display:flex; align-items:center; gap:11px; margin-bottom:4px}
  .mark{flex:0 0 auto; width:38px; height:38px}
  h1{font-size:24px; margin:0; letter-spacing:-.01em}
  .tag{color:var(--mut); font-size:13.5px; margin:0 0 0 49px}

  /* 언어 */
  .langs{display:flex; gap:6px; margin:17px 0 13px; flex-wrap:wrap}
  .langs button{
    flex:1 1 auto; padding:8px 4px; font-size:13px; border:1px solid var(--line);
    background:#fff; color:var(--mut); border-radius:7px; cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600}

  /* 안내 */
  .intro{background:#fff; border:1px solid var(--line); border-radius:11px; padding:15px 16px; margin-bottom:14px}
  .intro > p{margin:0 0 11px; font-size:13.8px; color:var(--mut)}
  .intro dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:start}
  .intro dt{
    width:21px; height:21px; border-radius:50%; background:var(--bg);
    border:1px solid var(--line); color:var(--mut);
    font-size:11.5px; font-weight:700; text-align:center; line-height:19px; margin:1px 0 0;
  }
  .intro dd{margin:0; font-size:13.8px; line-height:1.5}

  /* 탭 */
  .tabs{display:flex; gap:5px; margin-bottom:16px}
  .tabs button{
    flex:1; min-height:52px; padding:9px 6px; font-size:12.5px; line-height:1.32;
    border:1px solid var(--line); background:#fff; color:var(--mut);
    border-radius:9px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .tabs button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600}
  .tabs button[data-t="sos"]{color:var(--risk)}
  .tabs button[data-t="sos"][aria-pressed="true"]{background:var(--risk); color:#fff; border-color:var(--risk)}

  .card{background:#fff; border:1px solid var(--line); border-radius:11px; padding:17px; margin-bottom:14px}
  label{display:block; font-size:13.5px; color:var(--mut); margin-bottom:9px}
  textarea{
    width:100%; min-height:120px; padding:12px; border:1px solid var(--line);
    border-radius:8px; font:inherit; font-size:15px; resize:vertical; color:var(--ink); background:#fff;
  }
  textarea.small{min-height:64px}
  .samples{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap}
  .samples button{
    padding:6px 11px; font-size:12.5px; border:1px solid var(--line);
    background:var(--bg); color:var(--mut); border-radius:20px; cursor:pointer;
  }
  .opts{display:flex; flex-direction:column; gap:7px}
  .opts button{
    text-align:left; padding:12px 13px; font:inherit; font-size:14px; line-height:1.45;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:8px; cursor:pointer;
  }
  .opts button[aria-pressed="true"]{border-color:var(--ink); border-width:2px; padding:11px 12px; font-weight:600}
  .go{
    margin-top:13px; width:100%; padding:14px; border:0; border-radius:8px;
    background:var(--ink); color:#fff; font:inherit; font-size:15.5px; font-weight:600; cursor:pointer;
  }
  .go:disabled{opacity:.5; cursor:default}

  /* 급할 때 전화 */
  .sos{display:block; background:var(--risk); color:#fff; border-radius:11px;
       padding:16px 17px; margin-bottom:14px; text-decoration:none}
  .sos strong{display:block; font-size:19px; margin-bottom:3px}
  .sos span{font-size:13.5px; opacity:.92}

  /* 기다리는 동안 */
  .wait{background:#fff; border:1px solid var(--line); border-radius:11px; padding:20px 17px; margin-bottom:14px}
  .wait p{margin:0 0 13px; font-size:14px; color:var(--mut); text-align:center}
  .dots{display:flex; gap:7px; justify-content:center; margin-bottom:15px}
  .dots i{width:8px; height:8px; border-radius:50%; background:var(--line); animation:bob 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.16s}
  .dots i:nth-child(3){animation-delay:.32s}
  @keyframes bob{0%,60%,100%{background:var(--line); transform:translateY(0)}
                 30%{background:var(--mut); transform:translateY(-5px)}}
  .bars i{display:block; height:11px; border-radius:5px; background:var(--bg); margin-bottom:8px; animation:fade 1.5s infinite}
  .bars i:nth-child(1){width:100%}
  .bars i:nth-child(2){width:88%; animation-delay:.2s}
  .bars i:nth-child(3){width:62%; animation-delay:.4s}
  @keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}

  /* 결과 */
  .verdict{border-radius:11px; padding:16px 17px; margin-bottom:14px; border:1px solid}
  .verdict h2{margin:0 0 6px; font-size:18.5px}
  .verdict p{margin:0; font-size:14.5px}
  .v-RISK,.v-NO{background:var(--riskbg); border-color:var(--risk)}
  .v-RISK h2,.v-NO h2{color:var(--risk)}
  .v-UNKNOWN,.v-LIMITED{background:var(--unkbg); border-color:var(--unk)}
  .v-UNKNOWN h2,.v-LIMITED h2{color:var(--unk)}
  .v-NORMAL,.v-YES,.v-NA{background:var(--normbg); border-color:var(--norm)}
  .v-NORMAL h2,.v-YES h2,.v-NA h2{color:var(--norm)}
  .due{background:var(--unkbg); border:1px solid var(--unk); border-radius:11px; padding:15px 17px; margin-bottom:14px}
  .due h3{color:var(--unk); margin:0 0 6px}
  .due p{margin:0; font-size:14.5px}
  .due .date{font-weight:700; font-size:16px; color:var(--unk); display:block; margin-top:7px}
  h3{font-size:14px; margin:0 0 10px; color:var(--mut); font-weight:600}
  ul,ol{margin:0; padding-left:19px}
  li{margin-bottom:9px} li:last-child{margin-bottom:0}
  .why{display:block; color:var(--mut); font-size:13.5px; margin-top:2px}
  .cons{margin:0}
  .cons dt{font-weight:600; font-size:14.5px; margin-bottom:3px}
  .cons dd{margin:0 0 13px; color:var(--mut); font-size:14px}
  .cons dd:last-child{margin-bottom:0}
  .tel{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .tel:last-child{border-bottom:0}
  .tel a{color:var(--ink); font-weight:600; text-decoration:none; white-space:nowrap}
  .msg{color:var(--mut); margin:0}
  .msg.bad{color:var(--risk)}

  footer{margin-top:26px; padding-top:15px; border-top:1px solid var(--line); font-size:12px; color:var(--mut)}
  footer p{margin:0 0 6px}
  .hide{display:none}
</style>
</head>
<body>

<div class="head">
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <rect x="1.4" y="1.4" width="37.2" height="37.2" rx="10"
          fill="none" stroke="#8a3b2e" stroke-width="2.2"/>
    <path d="M11.5 20.6 L17.6 26.4 L28.7 13.9" fill="none" stroke="#8a3b2e"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Check First</h1>
</div>
<p class="tag" id="tag"></p>

<div class="langs" id="langs">
  <button data-l="ko" aria-pressed="true">한국어</button>
  <button data-l="en" aria-pressed="false">English</button>
  <button data-l="vi" aria-pressed="false">Tieng Viet</button>
  <button data-l="zh" aria-pressed="false">简体中文</button>
</div>

  <dl id="intro-l"></dl>
</div>

  <button data-t="sos" aria-pressed="false" id="tab-sos"></button>

<div id="pane-msg">
  <div class="card">
    <label id="lbl-msg"></label>
    <textarea id="q"></textarea>
    <div class="samples" id="samples"></div>
    <button class="go" id="go-msg"></button>
  </div>
</div>

<div id="pane-acc" class="hide">

    <label id="lbl-case"></label>
    <div class="opts" id="cases"></div>
  </div>
  <div class="card">
    <label id="lbl-who"></label>
    <div class="opts" id="whos"></div>
  </div>
  <div class="card">
    <label id="lbl-extra"></label>
    <textarea id="extra" class="small"></textarea>
    <button class="go" id="go-acc"></button>
  </div>
</div>

<div id="pane-sos" class="hide">
  <a class="sos" href="tel:112">
    <strong id="sos-t"></strong>
    <span id="sos-s"></span>
  </a>
  <div class="card">
    <label id="lbl-kind"></label>
    <div class="opts" id="kinds"></div>
  </div>
  <div class="card">
    <label id="lbl-when"></label>
    <div class="opts" id="whens"></div>
  </div>
  <div class="card">
    <label id="lbl-extra2"></label>
    <textarea id="extra2" class="small"></textarea>
    <button class="go" id="go-sos"></button>
  </div>
</div>

<div id="out"></div>

<footer id="foot"></footer>

var CASE_KEYS = ["lend_account","already_lent","cash_job","id_copy","money_moved"];
var WHO_KEYS  = ["friend","online","job","unknown"];
var KIND_KEYS = ["transfer","cash","giftcard","crypto","overseas","card","info_only","app"];
var WHEN_KEYS = ["just_now","today","days"];

var SAMPLES = [
  "[국제발신] 검찰청입니다. 귀하 명의 계좌가 대포통장 범죄에 연루되어 조사가 필요합니다. 아래 링크로 접속해 안전계좌로 자산을 이전하십시오.",
  "형, 나 급한데 통장 하나만 빌려줄 수 있어? 환전 일인데 돈만 잠깐 들어왔다 나가는 거야. 하루에 30만원 줄게.",
  "[Web발신] 고객님의 8월 카드 이용대금 명세서가 발행되었습니다. 자세한 내용은 앱에서 확인하실 수 있습니다."
];

var lang = "ko", tab = "msg";
var pickedCase = null, pickedWho = null, pickedKind = null, pickedWhen = null;
var waitTimer = null;

function t(){ return T[lang]; }
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s).replace(/[<>&]/g, function(c){
    return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];
  });
}

// 주말을 뺀 세 번째 평일. 공휴일은 세지 않으므로 실제 기한과 같거나 그보다 이르다.
// 더 이른 날을 알려주는 쪽이 안전하다.
function workdayAfter(n){
  var d = new Date(), added = 0;
  while(added < n){
    d.setDate(d.getDate() + 1);
    var w = d.getDay();
    if(w !== 0 && w !== 6) added++;
  }
  var mm = d.getMonth() + 1, dd = d.getDate();
  if(lang === "ko") return d.getFullYear() + "년 " + mm + "월 " + dd + "일";
  if(lang === "zh") return d.getFullYear() + "年" + mm + "月" + dd + "日";
  return d.getFullYear() + "-" + (mm<10?"0":"") + mm + "-" + (dd<10?"0":"") + dd;
}

function buildOpts(holderId, keys, dict, picked, onPick){
  var box = $(holderId);
  box.innerHTML = "";
  keys.forEach(function(k){
    var b = document.createElement("button");
    b.textContent = dict[k];
    b.setAttribute("aria-pressed", picked === k ? "true" : "false");
    b.onclick = function(){ onPick(k); };
    box.appendChild(b);
  });
}

function paint(){
  var x = t();
  $("tag").textContent = x.tag;
  $("intro-p").textContent = x.introP;
  var dl = $("intro-l");
  dl.innerHTML = "";
  x.introL.forEach(function(line, i){
    var dt = document.createElement("dt");
    dt.textContent = String(i + 1);
    var dd = document.createElement("dd");
    dd.textContent = line;
    dl.appendChild(dt); dl.appendChild(dd);
  });

  $("tab-msg").textContent = x.tabMsg;
  $("tab-acc").textContent = x.tabAcc;
  $("tab-sos").textContent = x.tabSos;
  $("lbl-msg").textContent = x.lblMsg;
  $("lbl-case").textContent = x.lblCase;
  $("lbl-who").textContent = x.lblWho;
  $("lbl-kind").textContent = x.lblKind;
  $("lbl-when").textContent = x.lblWhen;
  $("lbl-extra").textContent = x.lblExtra;
  $("lbl-extra2").textContent = x.lblExtra;
  $("go-msg").textContent = x.go;
  $("go-acc").textContent = x.go;
  $("go-sos").textContent = x.go;
  $("sos-t").textContent = x.sosT;
  $("sos-s").textContent = x.sosS;

  var s = $("samples");
  s.innerHTML = "";
  x.samples.forEach(function(label, i){
    var b = document.createElement("button");
    b.textContent = label;
    b.onclick = function(){ $("q").value = SAMPLES[i]; };
    s.appendChild(b);
  });

  buildOpts("cases", CASE_KEYS, x.cases, pickedCase, function(k){ pickedCase = k; paint(); });
  buildOpts("whos",  WHO_KEYS,  x.whos,  pickedWho,  function(k){ pickedWho  = k; paint(); });
  buildOpts("kinds", KIND_KEYS, x.kinds, pickedKind, function(k){ pickedKind = k; paint(); });
  buildOpts("whens", WHEN_KEYS, x.whens, pickedWhen, function(k){ pickedWhen = k; paint(); });

  var f = $("foot");
  f.innerHTML = "";
  x.foot.forEach(function(line){
    var p = document.createElement("p");
    p.textContent = line;
    f.appendChild(p);
  });
}

$("langs").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b) return;
  lang = b.dataset.l;
  Array.prototype.forEach.call(document.querySelectorAll("#langs button"), function(x){
    x.setAttribute("aria-pressed", x === b ? "true" : "false");
  });
  clearWait();
  $("out").innerHTML = "";
  paint();
});

$("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b) return;
  tab = b.dataset.t;
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(x){
    x.setAttribute("aria-pressed", x === b ? "true" : "false");
  });
  $("pane-msg").className = tab === "msg" ? "" : "hide";
  $("pane-acc").className = tab === "acc" ? "" : "hide";
  $("pane-sos").className = tab === "sos" ? "" : "hide";
  clearWait();
  $("out").innerHTML = "";
});

function clearWait(){
  if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
}

function showWait(){
  var x = t(), i = 0;
  $("out").innerHTML =
    '<div class="wait">'
    + '<p id="wait-msg">' + esc(x.wait[0]) + '</p>'
    + '<div class="dots"><i></i><i></i><i></i></div>'
    + '<div class="bars"><i></i><i></i><i></i></div>'
    + '</div>';
  clearWait();
  waitTimer = setInterval(function(){
    i = (i + 1) % x.wait.length;
    var el = $("wait-msg");
    if(el) el.textContent = x.wait[i];
  }, 2600);
}

function note(text, bad){
  clearWait();
  $("out").innerHTML = '<div class="card"><p class="msg' + (bad ? " bad" : "") + '">' + esc(text) + '</p></div>';
}
function block(title, inner){
  return '<div class="card"><h3>' + esc(title) + '</h3>' + inner + '</div>';
}
function listOf(arr, ordered){
  var tag = ordered ? "ol" : "ul", h = "<" + tag + ">";
  arr.forEach(function(a){ h += "<li>" + esc(a) + "</li>"; });
  return h + "</" + tag + ">";
}
function contactsOf(arr){
  var h = "";
  arr.forEach(function(c){
    var num = String(c.number || "").replace(/[^0-9-]/g, "");
    h += '<div class="tel"><span>' + esc(c.name) + '</span>'
       + '<a href="tel:' + esc(num) + '">' + esc(c.number) + '</a></div>';
  });
  return h;
}

function renderMsg(d){
  var x = t();
  var h = '<div class="verdict v-' + esc(d.verdict) + '"><h2>' + esc(x["v" + d.verdict] || d.verdict) + '</h2>'
        + '<p>' + esc(d.headline || d.summary || "") + '</p></div>';
  if(d.summary && d.headline && d.summary !== d.headline)
    h += '<div class="card"><p class="msg">' + esc(d.summary) + '</p></div>';
  if(d.signals && d.signals.length){
    var inner = "<ul>";
    d.signals.forEach(function(s){
      inner += '<li>' + esc(s.point) + '<span class="why">' + esc(s.why) + '</span></li>';
    });
    h += block(x.sig, inner + "</ul>");
  }
  if(d.unknowns && d.unknowns.length) h += block(x.unk, listOf(d.unknowns, false));
  if(d.actions && d.actions.length)   h += block(x.act, listOf(d.actions, true));
  if(d.contacts && d.contacts.length) h += block(x.con, contactsOf(d.contacts));
  $("out").innerHTML = h;
}

function renderAcc(d){
  var x = t();
  var h = '<div class="verdict v-RISK"><h2>' + esc(x.vRISK) + '</h2>'
        + '<p>' + esc(d.headline || "") + '</p></div>';
  if(d.summary) h += '<div class="card"><p class="msg">' + esc(d.summary) + '</p></div>';
  if(d.consequences && d.consequences.length){
    var inner = '<dl class="cons">';
    d.consequences.forEach(function(c){
      inner += "<dt>" + esc(c.title) + "</dt><dd>" + esc(c.detail) + "</dd>";
    });
    h += block(x.cons, inner + "</dl>");
  }
  if(d.actions && d.actions.length)   h += block(x.act, listOf(d.actions, true));
  if(d.keep && d.keep.length)         h += block(x.keep, listOf(d.keep, false));
  if(d.contacts && d.contacts.length) h += block(x.con, contactsOf(d.contacts));
  $("out").innerHTML = h;
}

function renderSos(d){
  var x = t();
  var r = d.recoverable || "LIMITED";
  var h = '<div class="verdict v-' + esc(r) + '"><h2>' + esc(x["v" + r] || "") + '</h2>'
        + '<p>' + esc(d.headline || "") + '</p></div>';
  if(d.summary) h += '<div class="card"><p class="msg">' + esc(d.summary) + '</p></div>';
  if(d.now && d.now.length) h += block(x.now, listOf(d.now, true));
  if(d.deadline && d.deadline.applies){
    h += '<div class="due"><h3>' + esc(x.due) + '</h3><p>' + esc(d.deadline.text)
       + '<span class="date">' + esc(x.dueBy) + " " + esc(workdayAfter(3)) + '</span></p></div>';
  }
  if(d.later && d.later.length)       h += block(x.later, listOf(d.later, true));
  if(d.keep && d.keep.length)         h += block(x.keep, listOf(d.keep, false));
  if(d.warn && d.warn.length)         h += block(x.warn, listOf(d.warn, false));
  if(d.contacts && d.contacts.length) h += block(x.con, contactsOf(d.contacts));
  $("out").innerHTML = h;
}

async function send(btn, url, body, onOk){
  var x = t();
  btn.disabled = true;
  showWait();
  try{
    var res = await fetch(url, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    var d = await res.json();
    clearWait();
    if(d.verdict === "INVALID"){ note(x.short); }
    else if(!res.ok || d.error){ note(x.fail, true); }
    else { onOk(d); }
  }catch(e){
    note(x.fail, true);
  }finally{
    clearWait();
    btn.disabled = false;
  }
}

$("go-msg").addEventListener("click", function(){
  var x = t(), text = $("q").value.trim();
  if(text.length < 5){ note(x.short); return; }
  send(this, "/api/check", { text:text, lang:lang }, renderMsg);
});

$("go-acc").addEventListener("click", function(){
  var x = t();
  if(!pickedCase){ note(x.needCase); return; }
  send(this, "/api/account",
       { "case":pickedCase, who:pickedWho, lang:lang, extra:$("extra").value },
       renderAcc);
});

$("go-sos").addEventListener("click", function(){
  var x = t();
  if(!pickedKind){ note(x.needKind); return; }
  send(this, "/api/emergency",
       { kind:pickedKind, when:pickedWhen, lang:lang, extra:$("extra2").value },
       renderSos);
});

paint();
</script>

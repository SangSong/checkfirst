<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check First</title>
<style>
  :root {
    --ink: #1c1c1c;
    --mut: #6b6b6b;
    --line: #d8d4cc;
    --bg: #faf9f7;
    --acc: #8a3b2e;
    --ok: #2f5d50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 18px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    line-height: 1.6;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--mut); font-size: 14px; margin: 0 0 28px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .label { font-size: 13px; color: var(--mut); margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 96px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 15px;
    resize: vertical;
    background: #fff;
    color: var(--ink);
  }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: var(--acc);
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #out {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    margin: 0;
  }
  .muted { color: var(--mut); }
  .ok { color: var(--ok); font-weight: 600; }
  .err { color: var(--acc); font-weight: 600; }
  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--mut);
  }
</style>
</head>
<body>

<h1>Check First</h1>
<p class="sub">배포 점검용 화면입니다. 기능은 아직 붙지 않았습니다.</p>

<div class="card">
  <div class="label">아무 문장이나 입력한 뒤 눌러보세요</div>
  <textarea id="q" placeholder="예: 안녕하세요"></textarea>
  <button id="go">연결 확인</button>
</div>

<div class="card">
  <div class="label">결과</div>
  <p id="out" class="muted">아직 실행하지 않았습니다.</p>
</div>

<footer>
  이 화면은 서버 연결이 정상인지 확인하기 위한 임시 페이지입니다.
  입력한 내용은 저장되지 않습니다.
</footer>

<script>
  const btn = document.getElementById('go');
  const out = document.getElementById('out');

  btn.addEventListener('click', async () => {
    const text = document.getElementById('q').value.trim();
    if (!text) {
      out.className = 'muted';
      out.textContent = '문장을 먼저 입력해 주세요.';
      return;
    }
    btn.disabled = true;
    out.className = 'muted';
    out.textContent = '확인 중입니다...';
    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text })
      });
      const data = await res.json();
      if (res.ok && data.text) {
        out.className = '';
        out.innerHTML = '<span class="ok">연결 정상</span>\n\n' +
          data.text.replace(/</g, '&lt;');
      } else {
        out.className = '';
        out.innerHTML = '<span class="err">오류</span>\n\n' +
          (data.error || '알 수 없는 오류').replace(/</g, '&lt;');
      }
    } catch (e) {
      out.className = '';
      out.innerHTML = '<span class="err">서버에 닿지 못했습니다</span>\n\n' + e;
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
